name: 建置並發布 PPPoE 工具容器

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch: # 允許手動觸發

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: 檢查程式碼
    runs-on: ubuntu-26.04

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v6

    - name: 安裝 Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: 測試
      run: cargo test

  server:
    name: 建置並推送映像
    runs-on: ubuntu-26.04

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v6

    - name: 設定 Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 登入 GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 擷取server中繼資料
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - uses: robinraju/release-downloader@v1.13
      with:
        repository: "go-gost/gost"
        latest: true
        fileName: "gost_*_linux_amd64v3.tar.gz"
        extract: true

    - name: build and push server
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=server
        cache-to: type=gha,mode=max,scope=server

  client:
    name: 建置並推送映像
    runs-on: ubuntu-26.04

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v6

    - name: 設定 Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 登入 GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 擷取client中繼資料
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-client
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - uses: robinraju/release-downloader@v1.13
      with:
        repository: "go-gost/gost"
        latest: true
        fileName: "gost_*_linux_amd64v3.tar.gz"
        extract: true

    - name: build and push client
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./client/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=client
        cache-to: type=gha,mode=max,scope=client